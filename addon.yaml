name: Home Assistant YAML Corrector
description: Validate and auto-correct deprecated YAML syntax with dynamic deprecation tracking
slug: ha-yaml-corrector
codeowners:
  - !secret codeowner
category: tools
version: 1.0.0
image: ghcr.io/homeassistant/{arch}-ha-yaml-corrector
init: false
arch:
  - amd64
  - armv7
  - arm64
ports:
  8080/tcp: 8080
options:
  sync_interval: 360
  github_token: ""
  log_level: info
  max_cache_age: 86400
schema:
  sync_interval:
    int:
      min: 60
      max: 1440
      description: "Minutes between sync operations (60-1440)"
  github_token:
    string:
      description: "Optional GitHub token for higher rate limits (leave empty to use unauthenticated)"
  log_level:
    select:
      options:
        - debug
        - info
        - warning
        - error
      description: "Logging level"
  max_cache_age:
    int:
      min: 3600
      max: 604800
      description: "Seconds to cache deprecation data (1-7 days)"
healthcheck:
  test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 10s
environment:
  PYTHONUNBUFFERED: "1"
